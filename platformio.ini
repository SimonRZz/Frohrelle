[platformio]
src_dir = firmware/CWPaddleMIDI

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Natives USB des S3 im TinyUSB-Modus - Voraussetzung fuer USB-MIDI
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
